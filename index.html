<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FeelUs — Ruang Privat Kita Berdua</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Firebase Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-rose-50/60 text-slate-800 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Konfigurasi Cloud Firebase Otomatis (feelus-7612d)
    const DEFAULT_FIREBASE_CONFIG = {
      apiKey: "AIzaSyBHX_1nKsmXX5DHTAnctf_00j01ARTRCrw",
      authDomain: "feelus-7612d.firebaseapp.com",
      projectId: "feelus-7612d"
    };

    const DEFAULT_STATE = {
      coupleInfo: {
        partner1: "Bima",
        partner2: "Nadia",
        anniversary: "2024-02-14",
        mood1: "😊 Bahagia",
        mood2: "🥰 Kangen",
        lastTouch: "Bima mengirim Peluk Hangat 🫂"
      },
      messages: [
        { id: 1, sender: "partner1", text: "Selamat datang di ruang privat kita berdua, FeelUs! ❤️", time: "09:00", type: "text" },
        { id: 2, sender: "partner2", text: "Sekarang kita bisa buka dari HP masing-masing ya 🥰", time: "09:02", type: "text" }
      ],
      posts: [
        {
          id: 101,
          author: "partner2",
          caption: "Sore itu minum kopi bareng sambil ngobrolin masa depan kita ☕✨",
          location: "Kafe Senja, Jakarta",
          imageUrl: "https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?auto=format&fit=crop&w=800&q=80",
          likes: ["partner1", "partner2"],
          comments: [{ id: 1, author: "partner1", text: "Momen favoritku! Minggu depan ke sini lagi yuk." }],
          time: "Kemarin"
        }
      ],
      deepTalk: {
        question: "Apa satu hal kecil yang aku lakukan yang selalu berhasil bikin kamu merasa dicintai?",
        answer1: "Waktu kamu selalu kabarin aku meski lagi sibuk banget.",
        answer2: "Cara kamu dengerin ceritaku dengan sabar sebelum tidur."
      },
      bucketList: [
        { id: 1, title: "Liburan berdua ke pantai saat sunset", done: true },
        { id: 2, title: "Masak makan malam romantis bareng di akhir pekan", done: false },
        { id: 3, title: "Nonton konser musisi favorit berdua", done: false }
      ]
    };

    function FeelUsApp() {
      // Identitas & Ruang Pasangan
      const [roomCode, setRoomCode] = useState(() => localStorage.getItem("feelus_room") || "KITA-BERDUA-01");
      const [activeRole, setActiveRole] = useState(() => localStorage.getItem("feelus_role") || "partner1");
      const [activeTab, setActiveTab] = useState("chat");

      // Data Aplikasi
      const [appData, setAppData] = useState(() => {
        const saved = localStorage.getItem(`feelus_data_${roomCode}`);
        return saved ? JSON.parse(saved) : DEFAULT_STATE;
      });

      // Status Cloud Firebase (Otomatis menggunakan DEFAULT_FIREBASE_CONFIG)
      const [firebaseConfigStr, setFirebaseConfigStr] = useState(() => {
        const savedConfig = localStorage.getItem("feelus_fb_config");
        if (savedConfig) {
          try {
            JSON.parse(savedConfig);
            return savedConfig;
          } catch (e) {
            localStorage.removeItem("feelus_fb_config");
          }
        }
        return JSON.stringify(DEFAULT_FIREBASE_CONFIG, null, 2);
      });

      const [isCloudConnected, setIsCloudConnected] = useState(false);
      const [cloudError, setCloudError] = useState("");
      const [showCloudModal, setShowCloudModal] = useState(false);

      // Input States
      const [chatInput, setChatInput] = useState("");
      const [msgType, setMsgType] = useState("text");
      const [newPostCaption, setNewPostCaption] = useState("");
      const [newPostImage, setNewPostImage] = useState("");
      const [newPostLocation, setNewPostLocation] = useState("");
      const [newBucket, setNewBucket] = useState("");
      const dbRef = useRef(null);
      const chatEndRef = useRef(null);

      // Inisialisasi & Sinkronisasi Firebase Firestore
      useEffect(() => {
        let parsedConfig = DEFAULT_FIREBASE_CONFIG;
        try {
          if (firebaseConfigStr.trim()) {
            parsedConfig = JSON.parse(firebaseConfigStr);
          }
        } catch (err) {
          setCloudError("Format JSON tidak valid, menggunakan konfigurasi bawaan.");
          parsedConfig = DEFAULT_FIREBASE_CONFIG;
        }

        try {
          if (!firebase.apps.length) {
            firebase.initializeApp(parsedConfig);
          }
          const db = firebase.firestore();
          dbRef.current = db;
          setIsCloudConnected(true);
          setCloudError("");

          const docRef = db.collection("feelus_rooms").doc(roomCode);
          const unsubscribe = docRef.onSnapshot((doc) => {
            if (doc.exists) {
              setAppData(doc.data());
            } else {
              docRef.set(appData);
            }
          }, (err) => {
            setCloudError("Pastikan Firestore Database sudah di-Enable (Test Mode): " + err.message);
            setIsCloudConnected(false);
          });

          return () => unsubscribe();
        } catch (err) {
          setCloudError("Gagal menghubungkan Firebase: " + err.message);
          setIsCloudConnected(false);
        }
      }, [firebaseConfigStr, roomCode]);

      // Simpan Lokal + Push ke Cloud
      const updateSharedData = async (newData) => {
        setAppData(newData);
        localStorage.setItem(`feelus_data_${roomCode}`, JSON.stringify(newData));
        if (isCloudConnected && dbRef.current) {
          try {
            await dbRef.current.collection("feelus_rooms").doc(roomCode).set(newData);
          } catch (e) {
            console.error("Cloud update error:", e);
          }
        }
      };

      const calculateDays = (dateStr) => {
        const start = new Date(dateStr);
        const now = new Date();
        const diff = Math.floor((now - start) / (1000 * 60 * 60 * 24));
        return diff >= 0 ? diff : 0;
      };

      const myName = activeRole === "partner1" ? appData.coupleInfo.partner1 : appData.coupleInfo.partner2;
      const partnerName = activeRole === "partner1" ? appData.coupleInfo.partner2 : appData.coupleInfo.partner1;

      const handleSendMessage = (e) => {
        e.preventDefault();
        if (!chatInput.trim()) return;
        const now = new Date();
        const timeStr = now.toTimeString().slice(0, 5);
        const newMsg = {
          id: Date.now(),
          sender: activeRole,
          text: chatInput,
          time: timeStr,
          type: msgType
        };
        updateSharedData({
          ...appData,
          messages: [...appData.messages, newMsg]
        });
        setChatInput("");
        setMsgType("text");
      };

      const sendTouch = (actionText) => {
        const text = `${myName} mengirim ${actionText}`;
        const now = new Date().toTimeString().slice(0, 5);
        updateSharedData({
          ...appData,
          coupleInfo: { ...appData.coupleInfo, lastTouch: text },
          messages: [
            ...appData.messages,
            { id: Date.now(), sender: activeRole, text: `✨ ${text}`, time: now, type: "lovenote" }
          ]
        });
      };

      const handleAddPost = (e) => {
        e.preventDefault();
        if (!newPostCaption.trim()) return;
        const newPost = {
          id: Date.now(),
          author: activeRole,
          caption: newPostCaption,
          location: newPostLocation || "Ruang Kita",
          imageUrl: newPostImage || "https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=800&q=80",
          likes: [activeRole],
          comments: [],
          time: "Baru saja"
        };
        updateSharedData({
          ...appData,
          posts: [newPost, ...appData.posts]
        });
        setNewPostCaption("");
        setNewPostImage("");
        setNewPostLocation("");
      };

      const toggleBucket = (id) => {
        const updated = appData.bucketList.map(item =>
          item.id === id ? { ...item, done: !item.done } : item
        );
        updateSharedData({ ...appData, bucketList: updated });
      };

      const addBucketItem = (e) => {
        e.preventDefault();
        if (!newBucket.trim()) return;
        updateSharedData({
          ...appData,
          bucketList: [...appData.bucketList, { id: Date.now(), title: newBucket, done: false }]
        });
        setNewBucket("");
      };

      return (
        <div className="max-w-md mx-auto min-h-screen bg-white shadow-2xl flex flex-col border-x border-rose-100">
          {/* Header Brand & Status Cloud */}
          <header className="bg-gradient-to-r from-rose-500 to-pink-500 text-white p-4 shadow-md">
            <div className="flex items-center justify-between">
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="text-xl font-extrabold tracking-tight">FeelUs</h1>
                  <span className="text-[10px] bg-white/20 px-2 py-0.5 rounded-full font-semibold">
                    feelus.space
                  </span>
                </div>
                <p className="text-xs text-rose-100 mt-0.5">
                  {appData.coupleInfo.partner1} ❤️ {appData.coupleInfo.partner2} • {calculateDays(appData.coupleInfo.anniversary)} Hari Bersama
                </p>
              </div>
              <button
                onClick={() => setShowCloudModal(true)}
                className={`text-xs px-3 py-1.5 rounded-full font-semibold flex items-center gap-1.5 shadow-sm transition ${
                  isCloudConnected ? "bg-emerald-500 text-white" : "bg-white text-rose-600"
                }`}
              >
                <span className={`w-2 h-2 rounded-full ${isCloudConnected ? "bg-white animate-ping" : "bg-amber-500"}`}></span>
                {isCloudConnected ? "Cloud Aktif" : "⚙️ Pengaturan"}
              </button>
            </div>

            {/* Bar Kode Ruang & Pilih Peran Perangkat */}
            <div className="mt-3 pt-2.5 border-t border-white/20 flex items-center justify-between text-xs">
              <div className="flex items-center gap-1.5">
                <span className="opacity-80">Kode Ruang:</span>
                <span className="font-mono font-bold bg-black/20 px-2 py-0.5 rounded">{roomCode}</span>
              </div>
              <div className="flex items-center gap-1 bg-black/15 p-0.5 rounded-lg">
                <button
                  onClick={() => { setActiveRole("partner1"); localStorage.setItem("feelus_role", "partner1"); }}
                  className={`px-2 py-1 rounded-md font-medium transition ${activeRole === "partner1" ? "bg-white text-rose-600 shadow" : "text-white/80"}`}
                >
                  {appData.coupleInfo.partner1}
                </button>
                <button
                  onClick={() => { setActiveRole("partner2"); localStorage.setItem("feelus_role", "partner2"); }}
                  className={`px-2 py-1 rounded-md font-medium transition ${activeRole === "partner2" ? "bg-white text-rose-600 shadow" : "text-white/80"}`}
                >
                  {appData.coupleInfo.partner2}
                </button>
              </div>
            </div>
          </header>

          {/* Bar Mood & Sentuhan Cepat */}
          <div className="bg-rose-50 px-4 py-2.5 border-b border-rose-100 flex items-center justify-between text-xs">
            <div className="truncate pr-2">
              <span className="font-semibold text-rose-700">Notifikasi: </span>
              <span className="text-slate-600">{appData.coupleInfo.lastTouch}</span>
            </div>
            <div className="flex gap-1 shrink-0">
              <button onClick={() => sendTouch("Peluk Hangat 🫂")} title="Kirim Peluk" className="bg-white hover:bg-rose-100 p-1.5 rounded-lg border border-rose-200">🫂</button>
              <button onClick={() => sendTouch("Cium Jauh 😘")} title="Kirim Cium" className="bg-white hover:bg-rose-100 p-1.5 rounded-lg border border-rose-200">😘</button>
              <button onClick={() => sendTouch("Colek Kangen 👉")} title="Colek Kangen" className="bg-white hover:bg-rose-100 p-1.5 rounded-lg border border-rose-200">👉</button>
            </div>
          </div>

          {/* Konten Utama */}
          <main className="flex-1 overflow-y-auto p-4 space-y-4">
            {activeTab === "chat" && (
              <div className="flex flex-col h-[62vh]">
                <div className="flex-1 overflow-y-auto space-y-3 pr-1">
                  {appData.messages.map((msg) => {
                    const isMe = msg.sender === activeRole;
                    return (
                      <div key={msg.id} className={`flex ${isMe ? "justify-end" : "justify-start"}`}>
                        <div
                          className={`max-w-[78%] rounded-2xl px-3.5 py-2.5 text-sm shadow-sm ${
                            msg.type === "lovenote"
                              ? "bg-amber-50 border border-amber-200 text-amber-900 font-medium"
                              : isMe
                              ? "bg-rose-500 text-white rounded-br-none"
                              : "bg-slate-100 text-slate-800 rounded-bl-none"
                          }`}
                        >
                          <p>{msg.text}</p>
                          <span className={`block text-[10px] mt-1 text-right ${isMe && msg.type !== "lovenote" ? "text-rose-100" : "text-slate-400"}`}>
                            {msg.time}
                          </span>
                        </div>
                      </div>
                    );
                  })}
                  <div ref={chatEndRef} />
                </div>

                <form onSubmit={handleSendMessage} className="mt-3 pt-2 border-t border-slate-100 flex gap-2">
                  <select
                    value={msgType}
                    onChange={(e) => setMsgType(e.target.value)}
                    className="text-xs bg-rose-50 border border-rose-200 rounded-xl px-2 text-rose-700 font-medium"
                  >
                    <option value="text">💬 Chat</option>
                    <option value="lovenote">💌 Surat</option>
                  </select>
                  <input
                    type="text"
                    value={chatInput}
                    onChange={(e) => setChatInput(e.target.value)}
                    placeholder={`Kirim pesan ke ${partnerName}...`}
                    className="flex-1 text-sm border border-slate-200 rounded-xl px-3.5 py-2 focus:outline-none focus:border-rose-400"
                  />
                  <button type="submit" className="bg-rose-500 hover:bg-rose-600 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-sm">
                    Kirim
                  </button>
                </form>
              </div>
            )}

            {activeTab === "feed" && (
              <div className="space-y-4">
                <form onSubmit={handleAddPost} className="bg-rose-50/70 p-3.5 rounded-2xl border border-rose-100 space-y-2.5">
                  <h3 className="text-xs font-bold text-rose-700 uppercase tracking-wider">📸 Bagikan Momen Berdua</h3>
                  <input
                    type="text"
                    placeholder="Ceritakan momen kalian hari ini..."
                    value={newPostCaption}
                    onChange={(e) => setNewPostCaption(e.target.value)}
                    className="w-full text-sm bg-white border border-rose-200 rounded-xl px-3 py-2"
                  />
                  <div className="grid grid-cols-2 gap-2">
                    <input
                      type="text"
                      placeholder="URL Foto (opsional)"
                      value={newPostImage}
                      onChange={(e) => setNewPostImage(e.target.value)}
                      className="text-xs bg-white border border-rose-200 rounded-xl px-3 py-2"
                    />
                    <input
                      type="text"
                      placeholder="📍 Lokasi kencan"
                      value={newPostLocation}
                      onChange={(e) => setNewPostLocation(e.target.value)}
                      className="text-xs bg-white border border-rose-200 rounded-xl px-3 py-2"
                    />
                  </div>
                  <button type="submit" className="w-full bg-rose-500 text-white text-xs font-bold py-2 rounded-xl shadow-sm">
                    Unggah ke Linimasa Kita
                  </button>
                </form>

                {appData.posts.map((post) => (
                  <div key={post.id} className="border border-slate-100 rounded-2xl overflow-hidden shadow-sm bg-white">
                    <div className="p-3 flex items-center justify-between">
                      <div>
                        <p className="text-xs font-bold text-slate-800">
                          {post.author === "partner1" ? appData.coupleInfo.partner1 : appData.coupleInfo.partner2}
                        </p>
                        <p className="text-[11px] text-slate-400">📍 {post.location} • {post.time}</p>
                      </div>
                      <span className="text-rose-500 text-sm">❤️ {post.likes.length}</span>
                    </div>
                    <img src={post.imageUrl} alt="Moment" className="w-full h-48 object-cover" />
                    <div className="p-3">
                      <p className="text-sm text-slate-700">{post.caption}</p>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {activeTab === "goals" && (
              <div className="space-y-4">
                <div className="bg-gradient-to-br from-rose-500 to-pink-600 text-white p-4 rounded-2xl shadow-sm space-y-3">
                  <span className="text-[10px] uppercase tracking-wider bg-white/20 px-2 py-0.5 rounded-full font-bold">
                    💬 Deep Talk Harian
                  </span>
                  <p className="text-sm font-semibold">{appData.deepTalk.question}</p>
                  <div className="space-y-2 text-xs">
                    <div className="bg-white/15 p-2.5 rounded-xl">
                      <p className="font-bold text-rose-100">{appData.coupleInfo.partner1}:</p>
                      <input
                        type="text"
                        value={appData.deepTalk.answer1}
                        onChange={(e) =>
                          updateSharedData({
                            ...appData,
                            deepTalk: { ...appData.deepTalk, answer1: e.target.value }
                          })
                        }
                        className="w-full bg-transparent border-b border-white/30 focus:outline-none mt-1 pb-0.5 text-white"
                      />
                    </div>
                    <div className="bg-white/15 p-2.5 rounded-xl">
                      <p className="font-bold text-rose-100">{appData.coupleInfo.partner2}:</p>
                      <input
                        type="text"
                        value={appData.deepTalk.answer2}
                        onChange={(e) =>
                          updateSharedData({
                            ...appData,
                            deepTalk: { ...appData.deepTalk, answer2: e.target.value }
                          })
                        }
                        className="w-full bg-transparent border-b border-white/30 focus:outline-none mt-1 pb-0.5 text-white"
                      />
                    </div>
                  </div>
                </div>

                <div className="border border-slate-200 rounded-2xl p-4 space-y-3">
                  <h3 className="text-sm font-bold text-slate-800">✨ Couple Bucket List</h3>
                  <form onSubmit={addBucketItem} className="flex gap-2">
                    <input
                      type="text"
                      placeholder="Tambah impian berdua..."
                      value={newBucket}
                      onChange={(e) => setNewBucket(e.target.value)}
                      className="flex-1 text-xs border border-slate-200 rounded-xl px-3 py-2"
                    />
                    <button type="submit" className="bg-rose-500 text-white text-xs font-bold px-3 py-2 rounded-xl">
                      + Tambah
                    </button>
                  </form>
                  <div className="space-y-2">
                    {appData.bucketList.map((item) => (
                      <div
                        key={item.id}
                        onClick={() => toggleBucket(item.id)}
                        className="flex items-center gap-2.5 p-2 rounded-xl hover:bg-slate-50 cursor-pointer border border-slate-100"
                      >
                        <input type="checkbox" checked={item.done} readOnly className="accent-rose-500 w-4 h-4" />
                        <span className={`text-xs ${item.done ? "line-through text-slate-400" : "text-slate-700 font-medium"}`}>
                          {item.title}
                        </span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* Navigasi Bawah */}
          <nav className="border-t border-slate-100 bg-white grid grid-cols-3 py-2 text-center text-xs font-semibold">
            <button
              onClick={() => setActiveTab("chat")}
              className={`py-1.5 ${activeTab === "chat" ? "text-rose-600" : "text-slate-400"}`}
            >
              💬 Obrolan
            </button>
            <button
              onClick={() => setActiveTab("feed")}
              className={`py-1.5 ${activeTab === "feed" ? "text-rose-600" : "text-slate-400"}`}
            >
              📸 Linimasa
            </button>
            <button
              onClick={() => setActiveTab("goals")}
              className={`py-1.5 ${activeTab === "goals" ? "text-rose-600" : "text-slate-400"}`}
            >
              🎯 Deep Talk & Goals
            </button>
          </nav>

          {/* Modal Pengaturan Cloud & Ruang Pasangan */}
          {showCloudModal && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-xl">
                <div className="flex justify-between items-center">
                  <h2 className="text-base font-bold text-slate-800">☁️ Pengaturan Cloud & Ruang</h2>
                  <button onClick={() => setShowCloudModal(false)} className="text-slate-400 hover:text-slate-600">✕</button>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="font-semibold text-slate-700 block mb-1">Kode Ruang Rahasia (Couple Code)</label>
                    <input
                      type="text"
                      value={roomCode}
                      onChange={(e) => {
                        const val = e.target.value.toUpperCase();
                        setRoomCode(val);
                        localStorage.setItem("feelus_room", val);
                      }}
                      className="w-full border border-slate-200 rounded-xl px-3 py-2 font-mono font-bold text-rose-600"
                    />
                    <p className="text-[11px] text-slate-400 mt-1">
                      Gunakan kode yang sama di HP Anda dan HP pasangan.
                    </p>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="font-semibold text-slate-700 block mb-1">Nama Pasangan 1</label>
                      <input
                        type="text"
                        value={appData.coupleInfo.partner1}
                        onChange={(e) =>
                          updateSharedData({
                            ...appData,
                            coupleInfo: { ...appData.coupleInfo, partner1: e.target.value }
                          })
                        }
                        className="w-full border border-slate-200 rounded-xl px-2.5 py-1.5"
                      />
                    </div>
                    <div>
                      <label className="font-semibold text-slate-700 block mb-1">Nama Pasangan 2</label>
                      <input
                        type="text"
                        value={appData.coupleInfo.partner2}
                        onChange={(e) =>
                          updateSharedData({
                            ...appData,
                            coupleInfo: { ...appData.coupleInfo, partner2: e.target.value }
                          })
                        }
                        className="w-full border border-slate-200 rounded-xl px-2.5 py-1.5"
                      />
                    </div>
                  </div>

                  <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-2.5 text-emerald-800">
                    <p className="font-bold">✅ Terhubung Otomatis ke Cloud</p>
                    <p className="text-[11px] mt-0.5">Project ID: <span className="font-mono font-semibold">feelus-7612d</span></p>
                    {cloudError && <p className="text-red-500 text-[11px] mt-1">{cloudError}</p>}
                  </div>
                </div>

                <button
                  onClick={() => setShowCloudModal(false)}
                  className="w-full bg-rose-500 text-white font-bold text-xs py-2.5 rounded-xl"
                >
                  Simpan & Tutup
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<FeelUsApp />);
  </script>
</body>
</html>
